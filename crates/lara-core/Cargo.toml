[package]
name = "lara-core"
version.workspace = true
edition.workspace = true
description = "LARA core: a mutable CSR adjacency store that keeps CSR-level scans while bounding update cost through leaf relocation and tree promotion."
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = []
# Unstable internals for measurement crates; never part of the public API.
bench-internals = []
# Every ic-stable-structures memory (a `VirtualMemory` from a `MemoryManager`, say) is a
# lara-core memory.
ic-stable-structures = ["dep:ic-stable-structures"]

[dependencies]
ic-stable-structures = { version = "0.7", optional = true }

[dev-dependencies]
expect-test = "1.5"
public-api = "0.52"
rustdoc-json = "0.9"
