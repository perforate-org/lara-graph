# A dedicated target dir keeps the wasm build apart from host builds. simd128 is on, as canisters
# using lara-graph should build with it (the IC runs wasm SIMD): auto-vectorization alone makes
# most benches 2-7 % cheaper.
build_cmd: "sh -c 'RUSTFLAGS=\"-C target-feature=+simd128\" CARGO_TARGET_DIR=../../target/canbench cargo build --release --target wasm32-unknown-unknown -p lara-graph-bench'"
wasm_path: "../../target/canbench/wasm32-unknown-unknown/release/lara_graph_bench.wasm"
