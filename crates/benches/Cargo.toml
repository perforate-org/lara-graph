[package]
name = "benches"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
dgap = { path = "../dgap" }
lara_core = { path = "../lara-core", package = "lara-core", features = ["bench-internals"] }
lara_graph = { path = "../lara", package = "lara-graph", features = ["mmap"] }
criterion = { workspace = true }
rand = { workspace = true }
petgraph = "0.8"

[lib]
name = "benches"
path = "src/lib.rs"

[[bench]]
name = "lara_bench"
harness = false

[[bench]]
name = "compare_native"
harness = false

# Frozen: this crate deliberately does not inherit `[workspace.lints]` (see the workspace Cargo.toml).
[lints.cargo]
missing_lints_inheritance = "allow"
